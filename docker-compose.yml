# Local dev services for apps/api. Ports are offset to avoid clashing with other projects.
name: boringtalks

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: boringtalks
      POSTGRES_PASSWORD: boringtalks
      POSTGRES_DB: boringtalks
    ports: ["127.0.0.1:55433:5432"]
    volumes: ["./.data/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boringtalks"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7
    ports: ["127.0.0.1:6480:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  # minio/minio is no longer published on Docker Hub; Chainguard builds the same server.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: boringtalks
      MINIO_ROOT_PASSWORD: boringtalks-secret
    ports: ["127.0.0.1:9100:9000", "127.0.0.1:9101:9001"]
    volumes: ["./.data/minio:/data"]

  # One-shot: creates the local bucket (prefixed like R2) and the test bucket (MinIO allows browser PUTs from any origin by default).
  minio-setup:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on: [minio]
    restart: on-failure
    environment:
      MC_HOST_local: http://boringtalks:boringtalks-secret@minio:9000
    command: ["mb", "--ignore-existing", "local/boringtalks", "local/boringtalks-test"]

