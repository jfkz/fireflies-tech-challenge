name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # test:cov enforces the coverage thresholds set in each package's vitest config.
      - run: pnpm turbo run lint typecheck test:cov build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            apps/*/coverage/coverage-summary.json
            packages/*/coverage/coverage-summary.json
          if-no-files-found: ignore

  api-e2e:
    name: API e2e (Postgres, Redis, MinIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chainguard's MinIO runs as a non-root user; the bind-mounted data folder must be writable.
      - run: mkdir -p .data/minio && chmod 777 .data/minio
      - run: docker compose up -d --wait postgres redis minio && docker compose up minio-setup
      - run: pnpm turbo run build --filter @boringtalks/api
      - run: pnpm --filter @boringtalks/api test:e2e
      - if: failure()
        run: docker compose logs --tail 200

  web-e2e:
    name: Web e2e (Playwright + Firebase Auth emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @boringtalks/e2e exec playwright install --with-deps chromium
      - run: pnpm turbo run test:e2e --filter @boringtalks/e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
