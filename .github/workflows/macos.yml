name: macOS app

# Every PR and push touching the app: build + unit tests (ad-hoc signed).
# Releases (Developer ID signing, notarization, publishing the DMG to R2) run on a
# developer's Mac with apps/macos/scripts/release.sh, so signing keys stay off CI.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: [apps/macos/**, .github/workflows/macos.yml]
  push:
    branches: [main]
    paths: [apps/macos/**, .github/workflows/macos.yml]

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - run: SIGN_IDENTITY=- scripts/test.sh
