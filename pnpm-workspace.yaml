packages:
  - apps/api
  - apps/web
  - packages/*
  - e2e

# Security fixes for transitive dependencies whose parents still pin vulnerable
# ranges (Dependabot alerts). Drop each once upstream catches up.
overrides:
  # @firebase/firestore pins ~1.9.0
  '@grpc/grpc-js@<1.13.6': ^1.14.6
  # @google-cloud/pubsub 5 (firebase-tools) pins ^1.30.1
  '@opentelemetry/core@<2.8.0': ^2.8.0
  # get-uri (firebase-tools > proxy-agent) pins ^5
  basic-ftp@<6.2.1: ^6.2.3
  # gaxios 6 (firebase-tools) pins ^9; 11 is the last line with CommonJS
  uuid@<11.1.1: ^11.1.1
  # drizzle-kit > @esbuild-kit/core-utils pins ~0.18.20
  '@esbuild-kit/core-utils>esbuild': ^0.25.12
